# Unique name for this workflow
name: Verify build (Linux + Windows)

# Fork-only verification for issue #661: runs the documented local setup
# (install, format check, lint, tests, build, start, dev) on Linux and Windows.
# Uses GitHub-hosted runners because forks have no access to trailheadapps-Ubuntu.

# Definition when the workflow should run
on:
    workflow_dispatch:
    push:
        branches:
            - 'svierk/**'

# Least-privilege token: this workflow only reads the repository
permissions:
    contents: read

# Jobs to be executed
jobs:
    verify-build:
        name: verify-build (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        steps:
            # Checkout with the runner's default line ending settings,
            # i. e. core.autocrlf=true on Windows like on most contributor machines
            - name: 'Checkout source code'
              uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            # Same Node.js version as Volta (package.json#volta.node)
            - name: 'Setup Node.js'
              uses: actions/setup-node@v7.1.0
              with:
                  node-version-file: package.json
                  cache: npm

            - name: 'Install npm dependencies'
              run: HUSKY=0 npm ci

            - name: 'Code formatting verification with Prettier'
              id: prettier
              run: npm run prettier:verify

            - name: 'Lint Lightning Web Components'
              run: npm run lint

            - name: 'Unit test Lightning Web Components'
              run: npm run test:unit

            # lwr build exits with 0 even when a route fails to build, it only
            # logs an [error] line - fail the step on such lines as well
            - name: 'Build LWR static site'
              run: |
                  npm run build 2>&1 | tee build.log
                  if grep -q '\[error\]' build.log; then
                      echo "::error title=Build LWR static site::lwr build logged errors, see the output above"
                      exit 1
                  fi

            - name: 'Install browser'
              run: |
                  npm install --no-save --no-audit --no-fund playwright@1.64.1
                  npx playwright install chromium

            # npm start serves the static site from /site
            - name: 'Smoke test static server'
              run: |
                  PORT=3001 npm start > start.log 2>&1 &
                  for i in $(seq 1 60); do
                      status=$(curl -s -o start.html -w '%{http_code}' http://localhost:3001/ || true)
                      [ "$status" = "200" ] && break
                      sleep 2
                  done
                  echo "HTTP status: $status"
                  test "$status" = "200"
                  node scripts/verify/browser-check.mjs http://localhost:3001

            # npm run dev compiles the modules on request - the reported
            # Windows error surfaced here as well
            - name: 'Smoke test dev server'
              run: |
                  npm run dev > dev.log 2>&1 &
                  for i in $(seq 1 90); do
                      status=$(curl -s -o dev.html -w '%{http_code}' http://localhost:3000/ || true)
                      [ "$status" = "200" ] && break
                      sleep 2
                  done
                  sleep 5
                  cat dev.log
                  echo "HTTP status: $status"
                  test "$status" = "200"
                  node scripts/verify/browser-check.mjs http://localhost:3000
                  if grep -q '\[error\]' dev.log; then
                      echo "::error title=Smoke test dev server::lwr dev logged errors, see the output above"
                      exit 1
                  fi

            - name: 'Summary'
              if: always()
              run: |
                  {
                      echo "### ${{ matrix.os }}"
                      echo "- Node.js: $(node -v), npm: $(npm -v)"
                      echo "- core.autocrlf: $(git config --get core.autocrlf || echo unset)"
                      echo "- Prettier verify: ${{ steps.prettier.outcome }}"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: 'Upload logs'
              if: always()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: logs-${{ matrix.os }}
                  path: |
                      build.log
                      start.log
                      dev.log
                  if-no-files-found: ignore
